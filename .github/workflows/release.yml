name: build-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK parts
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "build-tools;34.0.0" "platforms;android-36" >/dev/null
      - name: Build APK
        run: bash ci/build.sh
        env:
          GH_PERSONAL_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
          VC: '486'
          VN: '1.5'
      - name: Upload to Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: test-slim
          name: Assistant test-slim (no libpython)
          files: Assistant.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Assistant-debug
          if-no-files-found: ignore
          path: |
            Assistant.apk
            with-dex-debug.apk
